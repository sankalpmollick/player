<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <title>Thetrue Player - Listen to a Library of All Audio of Thetrue</title>
    <meta name="description" content="Listen to a curated collection of insightful audio tracks on Thetrue Player. Stream and download your favorite talks and music anytime, anywhere.">
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="category-icon" aria-label="Toggle categories" role="button" tabindex="0">
        <i class="fas fa-th-large"></i>
    </div>

    <div id="menu-icon" aria-label="Toggle menu" role="button" tabindex="0">
        <i class="fas fa-bars"></i>
    </div>

    <div id="category-sidebar" class="sidebar-left" aria-hidden="true">
        <div class="sidebar-header">
            <h3><i class="fas fa-music"></i> Categories</h3>
        </div>
        <nav>
            <ul id="category-list">
                </ul>
        </nav>
    </div>

    <div id="sidebar-menu" class="sidebar-right" aria-hidden="true">
        <div class="sidebar-header">
            <h3><i class="fas fa-bars"></i> Menu</h3>
        </div>
        <nav>
            <ul>
                <li><a href="admin/" target="_blank" rel="noopener noreferrer"><i class="fas fa-user-shield"></i> Admin Login</a></li>
                <li><a href="about.html"><i class="fas fa-info-circle"></i> About Us</a></li>
                <li><a href="https://forum.thetrue.in" target="_blank"><i class="fas fa-comments"></i> Community Forum</a></li>
                <li><a href="privacy-policy.html"><i class="fas fa-user-secret"></i> Privacy Policy</a></li>
                <li><a href="terms.html"><i class="fas fa-file-contract"></i> Terms & Conditions</a></li>
            </ul>
        </nav>
    </div>

    <a href="/" class="logo-link">
        <h1><img src="logo.png" alt="Thetrue Player - Online Audio Library"></h1>
    </a>
    
    <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input type="search" id="searchInput" placeholder="Search for audio, podcasts, talks...">
    </div>

    <div class="player-container">
        <h2 id="audio-title">Select an audio to play</h2>
        <audio id="audio" preload="metadata"></audio>
        
        <div class="controls">
            <button id="play-pause-btn" class="control-btn" aria-label="Play/Pause">
                <i class="fas fa-play"></i>
            </button>
            <div class="progress-bar-container" aria-label="Audio progress bar">
                <div id="progress-bar"></div>
            </div>
            <div class="time-display">
                <span id="current-time">0:00</span> / <span id="total-duration">0:00</span>
            </div>
            
            <div class="action-buttons">
                <button id="share-btn" class="control-btn" title="Share" aria-label="Share audio">
                    <i class="fas fa-share-alt"></i>
                </button>
                <button id="download-btn" class="control-btn" title="Download" aria-label="Download audio">
                    <i class="fas fa-download"></i>
                </button>
            </div>
            
            <div class="social-share">
                <a href="#" class="social-btn whatsapp-btn" target="_blank" aria-label="Share on WhatsApp"><i class="fab fa-whatsapp"></i></a>
                <a href="#" class="social-btn facebook-btn" target="_blank" aria-label="Share on Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="social-btn twitter-btn" target="_blank" aria-label="Share on Twitter"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </div>
    
    <div id="audio-list" class="audio-list">
        </div>
    
    <div id="pagination-container" class="pagination-container">
        </div>

    <script src="script.js" defer></script>
</body>
</html>
